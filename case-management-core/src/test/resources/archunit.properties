# ArchUnit runs on JDK 26 here, whose class files are major version 70 — newer than the ASM
# bundled with ArchUnit 1.4.1 can parse. Left at the default, every rule evaluation logs a
# stack trace per JDK type it tries to resolve ("Error during import from
# jrt:/java.base/java/lang/String.class, falling back to simple import"), which buries real
# output under hundreds of harmless lines.
#
# Turning off classpath resolution of missing dependencies removes that entirely and does not
# weaken any rule in this repository: every rule here matches on the NAME of a directly
# referenced type (its package), and a type's own direct references come from its constant pool,
# which is read from the imported class itself. Only TRANSITIVE dependency traversal through
# unimported types is lost, and no rule here asks for that.
resolveMissingDependenciesFromClassPath=false
