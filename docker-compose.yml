services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: oracle
    ports:
      - "1521:1521"
    volumes:
      # Startup hooks run for both a new database and later container restarts. The SQL is
      # deliberately idempotent so an interrupted first initialization cannot permanently leave
      # the quickstart without its application accounts.
      - ./docker/oracle-init:/container-entrypoint-startdb.d:ro
    healthcheck:
      # The second argument ignores stale entrypoint marker files and checks the actual PDB state.
      test: ["CMD", "healthcheck.sh", "FREEPDB1", "ignore-entrypoint-markers"]
      interval: 10s
      timeout: 5s
      retries: 30
