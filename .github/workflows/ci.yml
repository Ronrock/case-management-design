name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect demo changes
    runs-on: ubuntu-latest
    outputs:
      react_demo: ${{ steps.filter.outputs.react_demo }}
      quickstart: ${{ steps.filter.outputs.quickstart }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            react_demo:
              - 'case-management-react-demo/**'
              - 'case-management-core/**'
              - 'case-management-rest/**'
              - 'case-management-spring-boot-starter/**'
              - 'case-management-poc-app/**'
              - 'pom.xml'
              - '.github/workflows/ci.yml'
            quickstart:
              - 'docker/**'
              - 'docker-compose.yml'
              - 'case-management-core/**'
              - 'case-management-engine-embedded/**'
              - 'case-management-rest/**'
              - 'case-management-spring-boot-starter/**'
              - 'case-management-poc-app/**'
              - 'pom.xml'
              - '.github/workflows/ci.yml'

  # Core starts Oracle through Testcontainers, so this job needs the Docker daemon that
  # ubuntu-latest already provides. It is independent from the downstream module jobs so an
  # Oracle infrastructure failure cannot hide every other module's result.
  java-core:
    name: Java core
    runs-on: ubuntu-latest
    # Exhaustive Oracle migration rehearsals take 33-56 minutes locally and were still making
    # forward Liquibase progress when the former 45-minute hosted limit cancelled the suite.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Test core
        run: ./mvnw --batch-mode -pl case-management-core test
      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-core-test-reports
          path: |
            case-management-core/target/surefire-reports/**
            case-management-core/target/failsafe-reports/**
          if-no-files-found: error

  java-embedded:
    name: Java module (case-management-engine-embedded)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install module prerequisites
        run: ./mvnw --batch-mode -DskipTests install
      - name: Test embedded module
        run: ./mvnw --batch-mode -pl case-management-engine-embedded test
      - name: Upload embedded test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-case-management-engine-embedded-test-reports
          path: |
            case-management-engine-embedded/target/surefire-reports/**
            case-management-engine-embedded/target/failsafe-reports/**
          if-no-files-found: error

  java-remote:
    name: Java module (case-management-engine-remote)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install module prerequisites
        run: ./mvnw --batch-mode -DskipTests install
      - name: Test remote module
        run: ./mvnw --batch-mode -pl case-management-engine-remote test
      - name: Upload remote test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-case-management-engine-remote-test-reports
          path: |
            case-management-engine-remote/target/surefire-reports/**
            case-management-engine-remote/target/failsafe-reports/**
          if-no-files-found: error

  java-rest:
    name: Java module (case-management-rest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install module prerequisites
        run: ./mvnw --batch-mode -DskipTests install
      - name: Test REST module
        run: ./mvnw --batch-mode -pl case-management-rest test
      - name: Upload REST test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-case-management-rest-test-reports
          path: |
            case-management-rest/target/surefire-reports/**
            case-management-rest/target/failsafe-reports/**
          if-no-files-found: error

  java-starter:
    name: Java module (case-management-spring-boot-starter)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install module prerequisites
        run: ./mvnw --batch-mode -DskipTests install
      - name: Test starter module
        run: ./mvnw --batch-mode -pl case-management-spring-boot-starter test
      - name: Upload starter test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-case-management-spring-boot-starter-test-reports
          path: |
            case-management-spring-boot-starter/target/surefire-reports/**
            case-management-spring-boot-starter/target/failsafe-reports/**
          if-no-files-found: error

  java-poc:
    name: Java module (case-management-poc-app)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install module prerequisites
        run: ./mvnw --batch-mode -DskipTests install
      - name: Test POC module
        run: ./mvnw --batch-mode -pl case-management-poc-app test
      - name: Upload POC test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-case-management-poc-app-test-reports
          path: |
            case-management-poc-app/target/surefire-reports/**
            case-management-poc-app/target/failsafe-reports/**
          if-no-files-found: error

  java:
    name: Java reactor
    if: always()
    needs: [java-core, java-embedded, java-remote, java-rest, java-starter, java-poc]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Java job to succeed
        env:
          CORE_RESULT: ${{ needs.java-core.result }}
          EMBEDDED_RESULT: ${{ needs.java-embedded.result }}
          REMOTE_RESULT: ${{ needs.java-remote.result }}
          REST_RESULT: ${{ needs.java-rest.result }}
          STARTER_RESULT: ${{ needs.java-starter.result }}
          POC_RESULT: ${{ needs.java-poc.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$EMBEDDED_RESULT" = success
          test "$REMOTE_RESULT" = success
          test "$REST_RESULT" = success
          test "$STARTER_RESULT" = success
          test "$POC_RESULT" = success

  # The published modeling vocabulary. This is a required check in its own right: a template
  # that binds the wrong namespace produces models the validator silently ignores, and nothing
  # in the Java reactor reads the template files.
  modeler-templates:
    name: Modeler templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modeler-templates/package-lock.json
      - name: Install
        run: npm ci
        working-directory: modeler-templates
      - name: Test
        run: npm test
        working-directory: modeler-templates

  web-components:
    name: Web components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: case-management-web-components/package-lock.json
      - name: Install
        run: npm ci
        working-directory: case-management-web-components
      - name: Build
        run: npm run build
        working-directory: case-management-web-components
      - name: Test
        run: npm test
        working-directory: case-management-web-components

  react-demo:
    name: React demo
    needs: changes
    if: needs.changes.outputs.react_demo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: case-management-react-demo/package-lock.json
      - name: Install
        run: npm ci
        working-directory: case-management-react-demo
      - name: Test
        run: npm test
        working-directory: case-management-react-demo
      - name: Lint
        run: npm run lint
        working-directory: case-management-react-demo
      - name: Build
        run: npm run build
        working-directory: case-management-react-demo

  demo-quickstart:
    name: Demo quickstart
    needs: changes
    if: needs.changes.outputs.quickstart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Start a fresh Oracle database
        run: docker compose up -d --wait oracle
      - name: Package the PoC backend
        run: ./mvnw --batch-mode -DskipTests -pl case-management-poc-app -am package
      - name: Start the PoC backend
        id: backend
        env:
          CASEMGMT_WEBHOOK_SECRET_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          java -jar case-management-poc-app/target/case-management-poc-app-0.1.0-SNAPSHOT.jar > "$RUNNER_TEMP/poc.log" 2>&1 &
          echo "pid=$!" >> "$GITHUB_OUTPUT"
      - name: Verify the documented backend startup
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent --user alice:alice 'http://127.0.0.1:8080/case-api/v2/cases?pageSize=1' > /dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat "$RUNNER_TEMP/poc.log"
          exit 1
      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-quickstart-backend-log
          path: ${{ runner.temp }}/poc.log
          if-no-files-found: error
      - name: Stop the quickstart
        if: always()
        env:
          BACKEND_PID: ${{ steps.backend.outputs.pid }}
        run: |
          if test -n "$BACKEND_PID"; then
            kill "$BACKEND_PID" || true
          fi
          docker compose down -v
