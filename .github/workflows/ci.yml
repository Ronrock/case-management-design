name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Core starts Oracle through Testcontainers, so this job needs the Docker daemon that
  # ubuntu-latest already provides. It is independent from the downstream module matrix so an
  # Oracle infrastructure failure cannot hide every other module's result.
  java-core:
    name: Java core
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Test core
        run: ./mvnw --batch-mode -pl case-management-core test
      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-core-test-reports
          path: |
            case-management-core/target/surefire-reports/**
            case-management-core/target/failsafe-reports/**
          if-no-files-found: error

  java-module:
    name: Java module (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        module:
          - case-management-engine-embedded
          - case-management-engine-remote
          - case-management-rest
          - case-management-spring-boot-starter
          - case-management-poc-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Install module prerequisites
        run: ./mvnw --batch-mode -DskipTests install
      - name: Test module
        run: ./mvnw --batch-mode -pl "${{ matrix.module }}" test
      - name: Upload module test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-${{ matrix.module }}-test-reports
          path: |
            ${{ matrix.module }}/target/surefire-reports/**
            ${{ matrix.module }}/target/failsafe-reports/**
          if-no-files-found: error

  # This normal dependency gate is durable evidence that the complete matrix succeeded. When
  # any leg fails, is cancelled, or is skipped, this job is skipped too; a partial rerun cannot
  # turn that original skipped sentinel into success by reporting only the rerun leg's result.
  java-module-complete:
    name: Java module matrix complete
    needs: java-module
    runs-on: ubuntu-latest
    steps:
      - name: Confirm complete module matrix
        run: 'true'

  java:
    name: Java reactor
    if: always()
    needs: [java-core, java-module, java-module-complete]
    runs-on: ubuntu-latest
    steps:
      - name: Require every Java job to succeed
        env:
          CORE_RESULT: ${{ needs.java-core.result }}
          MODULE_RESULT: ${{ needs.java-module.result }}
          MODULE_COMPLETE_RESULT: ${{ needs.java-module-complete.result }}
        run: |
          test "$CORE_RESULT" = success
          test "$MODULE_RESULT" = success
          test "$MODULE_COMPLETE_RESULT" = success

  # The published modeling vocabulary. This is a required check in its own right: a template
  # that binds the wrong namespace produces models the validator silently ignores, and nothing
  # in the Java reactor reads the template files.
  modeler-templates:
    name: Modeler templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: modeler-templates/package-lock.json
      - name: Install
        run: npm ci
        working-directory: modeler-templates
      - name: Test
        run: npm test
        working-directory: modeler-templates

  web-components:
    name: Web components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: case-management-web-components/package-lock.json
      - name: Install
        run: npm ci
        working-directory: case-management-web-components
      - name: Build
        run: npm run build
        working-directory: case-management-web-components
      - name: Test
        run: npm test
        working-directory: case-management-web-components
